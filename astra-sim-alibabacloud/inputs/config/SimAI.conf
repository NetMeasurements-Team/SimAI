# OUTPUT FILES
ENABLE_TRACE 1
FLOW_FILE /etc/astra-sim/simulation/flow1.txt
TRACE_FILE /etc/astra-sim/simulation/trace1.txt
TRACE_OUTPUT_FILE /etc/astra-sim/simulation/mix.tr
FCT_OUTPUT_FILE /etc/astra-sim/simulation/fct.txt
PFC_OUTPUT_FILE /etc/astra-sim/simulation/pfc.txt

# MONITOR SETTINGS
QLEN_MON_FILE /etc/astra-sim/simulation/qlen.txt
# TX_BW_MON_FILE /etc/astra-sim/simulation/tx_bw.txt
# RX_BW_MON_FILE /etc/astra-sim/simulation/rx_bw.txt
BW_MON_FILE /ns-3-alibabacloud/simulation/examples/rdma-test/outputs/bw.txt
RATE_MON_FILE /etc/astra-sim/simulation/rate.txt
CNP_MON_FILE /etc/astra-sim/simulation/cnp.txt
MON_START 0
MON_END 20000
QP_MON_INTERVAL 100
QLEN_MON_INTERVAL 10000
BW_MON_INTERVAL 1000

# VAR SETTINGS
SIMULATOR_STOP_TIME 40000000000000.00
ERROR_RATE_PER_LINK 0.0000
HAS_WIN 1
GLOBAL_T 0
INT_MULTI 1
PINT_LOG_BASE 1.05

ACK_HIGH_PRIO 0

LINK_DOWN 0 0 0

# Incremented count from 8 to 9, added new entry at the end
KMAX_MAP 11 720000000000 6000 180000000000 1500 25000000000 400 50000000000 800 100000000000 1600 200000000000 1200 360000000000 3200 400000000000 3200 1600000000000 2400 2880000000000 24000000 128000000000 1000
KMIN_MAP 11 720000000000 1500 180000000000 375 25000000000 100 50000000000 200 100000000000 400 200000000000 300 360000000000 800 400000000000 800 1600000000000 600 2880000000000 6000000 128000000000 500
PMAX_MAP 11 720000000000 0.2 180000000000 0.05 25000000000 0.2 50000000000 0.2 100000000000 0.2 200000000000 0.8 360000000000 0.2 400000000000 0.2 1600000000000 0.2 2880000000000 0.2 128000000000 0.5

# NS3 SETTINGS
ENABLE_FLOW_STRIPPING 0  // break a single message into multiple QPs at the host level
ENABLE_PACKET_SPRAYING 0  // packet-level ECMP routing at the switch level
REUSE_QPS 1
ENABLE_QCN 1
BUFFER_SIZE 32

## ns3::QbbNetDevice
PAUSE_TIME 5
USE_DYNAMIC_PFC_THRESHOLD 1

## ns3::SwitchNode
ENABLE_PFC 0
SWITCH_FORWARD_DELAY 1.5

## ns3::RdmaHw
PACKET_PAYLOAD_SIZE 9000
CC_MODE 1
RATE_AI 5Mb/s
RATE_HAI 50Mb/s
MIN_RATE 100Mb/s
L2_CHUNK_SIZE 4000
L2_ACK_INTERVAL 1
L2_BACK_TO_ZERO 0
VAR_WIN 1
RATE_BOUND 1
NIC_COALESCE_METHOD PER_QP
NACK_GEN_INTERVAL 0.01

##ns3::MellanoxDcqcn
ALPHA_RESUME_INTERVAL 1.0
RATE_DECREASE_INTERVAL 4.0
RP_TIMER 900.0
EWMA_GAIN 0.00390625
FAST_RECOVERY_TIMES 1
CLAMP_TARGET_RATE 0

##ns3::Dctcp
DCTCP_RATE_AI 1000Mb/s

##ns3::Hpcc
FAST_REACT 1
U_TARGET 0.95
MI_THRESH 0
MULTI_RATE 0
SAMPLE_FEEDBACK 0

##ns3::HpccPint
PINT_PROB 1.0

##ns3::RealDcqcn
RDCQCN_EWMAGAIN 0.00390625
RDCQCN_F 1
RDCQCN_RATE_UPDATE_DELAY 300us
RDCQCN_ALPHA_UPDATE_DELAY 2.56us
RDCQCN_BYTES_THRESHOLD 524240
RDCQCN_CLAMP 0
